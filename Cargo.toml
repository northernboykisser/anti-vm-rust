[package]
name = "antivm"
version = "0.2.0"
authors = ["СЕВЕРНЫЙBOYKISSER"]
edition = "2021"
description = "Anti virtualmachine or sites for check you program"
license = "MIT OR Apache-2.0"
repository = "https://github.com/northernboykisser/anti-vm-rust"
readme = "README.md"


[dependencies]
ureq     = { version = "2.10", features = ["json"] }
serde    = { version = "1",    features = ["derive"] }
serde_json = "1"
sysinfo  = { version = "0.32", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[dev-dependencies]
